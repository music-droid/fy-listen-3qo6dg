<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Flourish</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#a4622c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flourish"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f1e6;color:#2f2620;font:16px/1.5 system-ui,-apple-system,sans-serif}
form{background:#fffaf1;border:1px solid #e6d9c3;border-radius:18px;padding:24px;width:min(92vw,360px);box-shadow:0 6px 24px rgba(90,60,30,.08)}
h1{margin:0 0 4px;font:600 20px Georgia,serif}p{margin:0 0 14px;color:#6f6156;font-size:14px}
input[type=password]{width:100%;box-sizing:border-box;font-size:17px;padding:11px 12px;border:1px solid #e6d9c3;border-radius:10px;background:#f7f1e6}
button{margin-top:12px;width:100%;font-size:16px;padding:11px;border:0;border-radius:999px;background:#a4622c;color:#fff}
label{display:flex;gap:8px;align-items:center;font-size:13.5px;color:#6f6156;margin-top:10px}.err{color:#b2463b;font-size:13.5px;min-height:18px;margin-top:8px}</style></head>
<body><form id="f" autocomplete="on"><h1>Flourish</h1><p>Private. Enter the password to open.</p>
<input type="text" name="username" value="flourish" autocomplete="username" hidden>
<input id="pw" type="password" autocomplete="current-password" placeholder="Password" required autofocus>
<label><input id="rem" type="checkbox" checked> Remember on this device</label>
<button id="go">Open</button><div class="err" id="err"></div></form>
<script>
const SALT="SN8PsbCL+T2WiUTtU++ugg==",IT=600000;
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(raw){const key=await crypto.subtle.importKey("raw",ub(raw),"AES-GCM",false,["decrypt"]);
  const r=await fetch("app.enc",{cache:"no-cache"});const b=new Uint8Array(await r.arrayBuffer());
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(0,12)},key,b.slice(12)));
  sessionStorage.setItem("fl-k",raw);document.open();document.write(html);document.close();}
async function derive(pw){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return b64(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:ub(SALT),iterations:IT},k,256));}
const saved=sessionStorage.getItem("fl-k")||localStorage.getItem("fl-k");
if(saved)open_(saved).catch(()=>{localStorage.removeItem("fl-k");sessionStorage.removeItem("fl-k")});
document.getElementById("f").onsubmit=async e=>{e.preventDefault();const err=document.getElementById("err");err.textContent="Unlocking…";
  try{const rem=document.getElementById("rem").checked;const raw=await derive(document.getElementById("pw").value.trim());if(rem)localStorage.setItem("fl-k",raw);try{await open_(raw)}catch(z){localStorage.removeItem("fl-k");throw z}}
  catch(x){err.textContent="Wrong password. Try again."}};
</script></body></html>
